<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juice Mix Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style1.css" />
</head>

<body>

    <nav class="navbar" id="navbar"></nav>

    <section class="hero" id="hero"></section>
    <section class="features" id="features"></section>

    <section class="menu" id="menu"></section>


    <section class="mix-builder" id="build-your-mix"></section>
    <section class="signature-mix" id='signature-mix'></section>

    <section class="about" id="about"></section>

    <footer class="footer" id="footer"></footer>
    <!-- Cart Drawer: hidden until we build add-to-cart in the Menu section -->
    <aside class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer__header">
            <h3>Your Order</h3>
            <button id="cartClose" aria-label="Close cart">✕</button>
        </div>
        <div class="cart-drawer__items" id="cartItems">
            <p class="cart-drawer__empty">Your cart is empty.</p>
        </div>
        <div class="cart-drawer__footer">
            <div class="cart-drawer__total">Total: <span id="cartTotal">0</span> EGP</div>
            <a class="cart-checkout" id="cartCheckout" href="#" target="_blank" rel="noopener">
                <span class="cart-checkout__icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path
                            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.44 1.32 4.94L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.13a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.84-3.04-.2-.31a8.16 8.16 0 0 1-1.25-4.36c0-4.52 3.68-8.2 8.22-8.2 4.53 0 8.21 3.68 8.21 8.2 0 4.53-3.68 8.22-8.21 8.22zm4.5-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.1-.23-.16-.48-.28z" />
                    </svg>
                </span>

                <span>
                    Order via WhatsApp
                </span>

                <span class="cart-checkout__arrow">
                    →
                </span>
            </a>
        </div>
    </aside>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>

</html>
